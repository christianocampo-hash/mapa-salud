<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Salud - Región de Antofagasta</title>
    
    <!-- Estilos CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        /* Restablecer márgenes de la pantalla */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Contenedor del Mapa */
        #map {
            width: 100%;
            height: 100vh; /* Ocupa el 100% de la ventana */
        }

        /* Título flotante elegante */
        .map-title {
            position: absolute;
            top: 15px;
            left: 60px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin: 0;
            font-size: 18px;
            color: #2c3e50;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1 class="map-title">Red de Centros de Salud - Región de Antofagasta</h1>
    
    <!-- El div donde se dibujará el mapa -->
    <div id="map"></div>

    <!-- Scripts de la librería Leaflet -->
    <script src="https://unpkg.com"></script>

    <script>
        // 1. Inicializar el mapa centrado en la ciudad de Antofagasta (Coordenadas de la región)
        const map = L.map('map').setView([-23.6509, -70.3975], 13);

        // 2. Definición de Estilos de Mapas Base (Fondos)
        const mapaCallesOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        });

        const mapaTraficoGoogle = L.tileLayer('https://google.com{x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '&copy; Google Maps con Tráfico en Tiempo Real'
        });

        // Cargar por defecto el mapa en Modo Tráfico / Calles detalladas solicitado
        mapaTraficoGoogle.addTo(map);

        // 3. Crear los Grupos de Capas (Overlays) para agrupar los marcadores de salud
        const capaPublica = L.layerGroup();
        const capaPrivada = L.layerGroup();

        // Activarlas en el mapa desde el inicio
        capaPublica.addTo(map);
        capaPrivada.addTo(map);

        // 4. Configurar los iconos personalizados para diferenciar los centros (usando colores estándar)
        const iconoPublico = L.icon({
            iconUrl: 'https://githubusercontent.com',
            shadowUrl: '
https://cloudflare.com
',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // 5. Cargar los datos de los centros de salud desde el archivo externo JSON
        fetch('datos.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("No se pudo cargar el archivo datos.json. Verifica su ubicación.");
                }
                return response.json();
            })
            .then(establecimientos => {
                // Recorrer los establecimientos del JSON e indexarlos en el mapa
                establecimientos.forEach(centro => {
                    
                    // Validar que el elemento contenga coordenadas correctas
                    if (centro.latitud && centro.longitud) {
                        
                        // Diseñar el contenido informativo que saldrá al pinchar el marcador
                        const contenidoPopup = `
                            <div style="font-family: sans-serif; line-height: 1.4;">
                                <h3 style="margin: 0 0 5px 0; color: #2c3e50;">${centro.nombre}</h3>
                                <p style="margin: 0; color: #7f8c8d;"><b>Dirección:</b> ${centro.direccion}</p>
                                <p style="margin: 5px 0 0 0;"><span style="padding: 3px 8px; border-radius: 4px; font-size: 11px; color: #fff; background-color: ${centro.tipo === 'publico' ? '#2980b9' : '#c0392b'};">${centro.tipo.toUpperCase()}</span></p>
                            </div>
                        `;

                        // Crear el marcador físico
                        const marcador = L.marker([centro.latitud, centro.longitud], {
                            icon: centro.tipo === 'publico' ? iconoPublico : iconoPrivado
                        }).bindPopup(contenidoPopup);

                        // Asignar el marcador a la capa que le corresponde según el JSON
                        if (centro.tipo === 'publico') {
                            marcador.addTo(capaPublica);
                        } else if (centro.tipo === 'privado') {
                            marcador.addTo(capaPrivada);
                        }
                    }
                });
            })
            .catch(error => {
                console.error("Error procesando los centros de salud:", error);
                alert("Error al cargar la base de datos de centros de salud. Revisa la consola de desarrollador.");
            });

        // 6. Crear los paneles de control interactivos en pantalla (Esquina Superior Derecha)
        const mapasBase = {
            "Vista Tráfico / Calles Google": mapaTraficoGoogle,
            "Vista Clásica OpenStreetMap": mapaCallesOSM
        };

        const capasSalud = {
            "🏥 Centros Públicos (Azul)": capaPublica,
            "🏥 Centros Privados (Rojo)": capaPrivada
        };

        // Agregar el control al mapa interactivo para encender/apagar capas
        L.control.layers(mapasBase, capasSalud, { collapsed: false }).addTo(map);

    </script>
</body>
</html>
